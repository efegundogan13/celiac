{% extends "base.html" %}
{% block title %}Etkinlik Düzenle — Restoran Paneli{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-6">
  <h1 class="text-2xl font-bold mb-4">Etkinlik Düzenle</h1>

  <form method="POST" action="{{ url_for('restaurant_admin_event_edit', event_id=event.id) }}" class="space-y-4">
    <div>
      <label class="block text-sm font-medium">Başlık *</label>
      <input name="title" class="w-full p-2 border rounded" value="{{ event.title }}" required>
    </div>

    <div>
      <label class="block text-sm font-medium">Açıklama</label>
      <textarea name="description" class="w-full p-2 border rounded" rows="6">{{ event.description }}</textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium">Başlangıç (YYYY-MM-DD HH:MM) *</label>
        <input name="starts_at" class="w-full p-2 border rounded" value="{{ display_starts }}" required>
      </div>
      <div>
        <label class="block text-sm font-medium">Bitiş (opsiyonel)</label>
        <input name="ends_at" class="w-full p-2 border rounded" value="{{ display_ends }}">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium">Kontenjan (opsiyonel)</label>
      <input name="capacity" type="number" min="1" class="w-full p-2 border rounded" value="{{ event.capacity or '' }}">
    </div>

    <div>
      <label class="block text-sm font-medium">Ücret (TL - opsiyonel)</label>
      <input name="price" class="w-full p-2 border rounded" value="{{ event.price or '' }}">
    </div>

    <div>
      <label class="block text-sm font-medium">Ödeme / Bilet Linki (opsiyonel)</label>
      <input name="payment_url" class="w-full p-2 border rounded" value="{{ display_payment_url or '' }}">
      <p class="text-xs text-gray-500 mt-1">Varsa kullanıcıları dış ödeme/bilet sayfasına yönlendirmek için link ekleyin.</p>
    </div>

    <div class="flex items-center space-x-4">
      <button class="bg-green-600 text-white px-4 py-2 rounded">Güncelle</button>

      <form method="POST" action="{{ url_for('restaurant_admin_event_delete', event_id=event.id) }}" onsubmit="return confirm('Etkinliği silmek istediğinize emin misiniz?');" class="inline">
        <button type="submit" class="bg-red-600 text-white px-3 py-2 rounded">Sil</button>
      </form>

      <a href="{{ url_for('restaurant_admin_events') }}" class="text-gray-600">İptal</a>
    </div>
  </form>
</div>
{% endblock %}
