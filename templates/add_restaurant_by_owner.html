<h2 class="text-2xl font-bold mb-6">Restoran Ekle</h2>
<form method="POST">
  <input name="name" placeholder="Restoran Adı" required>
  <textarea name="description" placeholder="Açıklama"></textarea>
  <input name="city" placeholder="Şehir" required>
  <input name="district" placeholder="İlçe" required>
  <input name="latitude" placeholder="Enlem" required>
  <input name="longitude" placeholder="Boylam" required>
  <button type="submit">Gönder</button>
</form>
