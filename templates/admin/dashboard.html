{% extends "base.html" %}
{% block title %}Admin Paneli{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-green-700 mb-6">Admin Paneli</h1>

  <div class="grid grid-cols-2 gap-6">
    <div class="p-4 border rounded shadow">
      <h2 class="text-xl font-semibold">Kullanıcı Sayısı</h2>
      <p class="text-lg">{{ user_count }}</p>
    </div>
    <div class="p-4 border rounded shadow">
      <h2 class="text-xl font-semibold">Restoran Sayısı</h2>
      <p class="text-lg">{{ restaurant_count }}</p>
    </div>
    <div class="p-4 border rounded shadow">
      <h2 class="text-xl font-semibold">Ürün Sayısı</h2>
      <p class="text-lg">{{ product_count }}</p>
    </div>
    <div class="p-4 border rounded shadow">
      <h2 class="text-xl font-semibold">Yorum Sayısı</h2>
      <p class="text-lg">{{ comment_count }}</p>
    </div>
  </div>

  <div class="mt-6">
    <a href="{{ url_for('admin_applications') }}"
       class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Restoran Başvurularını Gör
    </a>
  </div>
</div>
{% endblock %}
